name: Auto Cloud 24/7 Live
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

concurrency:
  group: auto-cloud-live-group
  cancel-in-progress: false

permissions:
  actions: write

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install FFmpeg and Python Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install -U yt-dlp pytchat google-api-python-client google-auth-httplib2 google-auth-oauthlib pillow

      - name: Start Auto Cloud Live
        env:
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
        run: timeout 19800 python stream.py || true

            - name: Auto-Restart Next 24/7 Session
        if: success()
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://github.com" \
            -d '{"ref":"main"}'
